  .wrap{position:relative; z-index:1; width:100%; max-width:540px; margin:0 auto; padding:2.4rem 1.15rem 2.8rem}

  /* ── HEADER ── */
  .header{text-align:center; margin-bottom:1.5rem}
  .avatar{
    position:relative; width:104px; height:104px; margin:0 auto .9rem; border-radius:50%;
  }
  .avatar::before{
    content:""; position:absolute; inset:-95%; z-index:-1; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 50% 46%, rgba(96,165,250,.46), rgba(37,99,235,.16) 40%, transparent 66%);
    animation:halo 4.5s ease-in-out infinite;
  }
  @keyframes halo{0%,100%{opacity:.82; transform:scale(1)}50%{opacity:1; transform:scale(1.07)}}
  .avatar img{
    width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
    border:2.5px solid var(--gold); box-shadow:0 0 20px rgba(59,130,246,.30), inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .name{font-family:var(--serif); font-size:1.7rem; font-weight:700; line-height:1.08; letter-spacing:.2px}
  .name em{font-style:italic; color:var(--gold); font-weight:700; margin-right:.12em}
  .role{color:var(--muted); font-size:.78rem; font-weight:500; margin-top:.35rem; letter-spacing:.2px}

  /* ── BANNERS ── */
  .banner{
    position:relative; display:block; width:100%; height:142px;
    border-radius:22px; overflow:hidden; margin-bottom:.8rem;
    text-decoration:none; color:var(--text);
    border:1px solid rgba(255,255,255,.06);
    background:var(--card);
    box-shadow:0 12px 34px rgba(0,0,0,.55);
    transition:transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s, border-color .3s;
  }
  .banner:hover{transform:translateY(-4px) scale(1.012); border-color:rgba(59,130,246,.4); box-shadow:0 18px 46px rgba(0,0,0,.6)}
  .banner-media{position:absolute; inset:0; background-size:cover; background-position:center; transition:transform .5s ease}
  .banner:hover .banner-media{transform:scale(1.06)}
  .banner-shade{position:absolute; inset:0}
  .banner-body{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:center; padding:1rem 1.4rem}
  .eyebrow{font-size:.62rem; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-lt); margin-bottom:.4rem}
  .b-title{font-family:var(--disp); font-size:1.82rem; line-height:.95; letter-spacing:.5px; text-transform:uppercase}
  .b-title .alt{color:var(--gold)}
  .b-sub{font-size:.8rem; color:#d7d9de; margin-top:.55rem; font-weight:500}
  .b-cta{display:inline-flex; align-items:center; gap:.4rem; margin-top:.7rem; font-size:.78rem; font-weight:700; color:var(--gold-lt); width:fit-content}
  .b-cta svg{width:15px;height:15px;transition:transform .3s} .banner:hover .b-cta svg{transform:translateX(3px)}

  /* destaque com glow dourado */
  .banner--feat{border:1.5px solid rgba(59,130,246,.55); animation:featglow 3.6s ease-in-out infinite}
  @keyframes featglow{0%,100%{box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 22px rgba(59,130,246,.20)}50%{box-shadow:0 14px 42px rgba(0,0,0,.55),0 0 40px rgba(59,130,246,.42)}}
  .feat-badge{position:absolute; top:.85rem; right:.95rem; z-index:3; font-size:.58rem; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:#1a1208; background:linear-gradient(135deg,var(--gold-lt),var(--gold)); padding:.2rem .6rem; border-radius:100px; box-shadow:0 3px 10px rgba(59,130,246,.4)}

  /* logo no banner portfolio */
  .b-logo{height:56px; width:auto; max-width:78%; filter:drop-shadow(0 4px 14px rgba(59,130,246,.3))}

  /* ── FOOTER ── */
  .foot{text-align:center; margin-top:2rem; padding-top:1.4rem; border-top:1px solid rgba(255,255,255,.07); font-size:.76rem; color:var(--muted)}
  .foot a{color:var(--gold-lt); text-decoration:none; font-weight:600}

  /* ── FLOATING ── */

  /* banner com arte pronta (imagem inteira) */
  .banner--art{height:auto; padding:0; border:1.5px solid rgba(59,130,246,.5)}
  .banner--art img{display:block; width:100%; height:auto}

  /* responsivo mobile */
  @media(max-width:400px){
    .wrap{padding:2.1rem .85rem 2.4rem}
    .name{font-size:1.45rem}
    .role{font-size:.74rem}
    .avatar{width:82px;height:82px;margin-bottom:.7rem}
    .banner{height:128px}
    .banner--art{height:auto}
    .banner-body{padding:1.05rem 1.15rem}
    .b-title{font-size:1.62rem}
    .eyebrow{font-size:.58rem; letter-spacing:2px}
    .b-cta{font-size:.74rem}
  }
  @media(max-width:340px){ .b-title{font-size:1.42rem} }

  .reveal{opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s ease}
  .reveal.in{opacity:1; transform:translateY(0)}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none} .avatar::before,.banner--feat{animation:none}}
</style>
</head>
